spring:
  application:
    name: demo

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver


    
  docker:
    compose:
      file: docker-compose.yaml
      enabled: false

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        jdbc:
          batch_size: 100
        default_batch_fetch_size: 100
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true


  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

mail:
    from: ${MAIL_FROM:demoaithani@gmail.com}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 900000

  refresh-token-expiration-ms: 604800000


verification:
  expiration-ms: ${VERIFICATION_TOKEN_EXPIRATION_MS:86400000}
password-reset:
  expiration-ms: ${PASSWORD_RESET_TOKEN_EXPIRATION_MS:900000}

static-links:
  verificationLink: ${VERIFICATION_LINK:http://localhost:8080/api/auth/verify-email?token=}
  resetPasswordLink: ${RESET_PASSWORD_LINK:http://localhost:8080/api/auth/reset-password?token=}

groq:
  api-key: ${GROQ_API_KEY}
  base-url: https://api.groq.com/openai/v1
  model: openai/gpt-oss-20b

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY}
    places-base-url: https://places.googleapis.com/v1
    routes-base-url: https://routes.googleapis.com
transport:
  pricing:
    driving-cost-per-km: ${DRIVING_COST_PER_KM:15}
serpapi:
  api-key: ${SERPAPI_API_KEY}
  base-url: https://serpapi.com/search.json

