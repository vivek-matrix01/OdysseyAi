    name: demo

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/OdysseyAi}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:megha}
    driver-class-name: org.postgresql.Driver


    
  docker:
    compose:
      file: docker-compose.yaml

  jpa:
